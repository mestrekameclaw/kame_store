version: "3.7"

services:
  app_proxy:
    environment:
      # pgAdmin stays behind Umbrel's authenticated application proxy.
      APP_HOST: kame-postgres_pgadmin_1
      APP_PORT: 8080

  init-secrets:
    image: postgres:18.6-alpine3.23@sha256:697c180dbf244d3ce4a8f4cbc0156cde840af055c1bf8b76aebe422a4822086f
    user: "0:0"
    restart: on-failure
    security_opt:
      - no-new-privileges:true
    environment:
      APP_POSTGRES_PASSWORD: ${APP_POSTGRES_PASSWORD}
      POSTGRES_UID: "70"
      POSTGRES_GID: "70"
      PGADMIN_UID: "1000"
      PGADMIN_GID: "1000"
    entrypoint: ["/bin/sh", "/app/init-secrets.sh"]
    volumes:
      - ${APP_DATA_DIR}/init-secrets.sh:/app/init-secrets.sh:ro
      - ${APP_DATA_DIR}/data/secrets:/run/secrets
      - ${APP_DATA_DIR}/data/postgres:/var/lib/postgresql:ro
      - ${APP_DATA_DIR}/data/pgadmin:/var/lib/pgadmin

  postgres:
    image: postgres:18.6-alpine3.23@sha256:697c180dbf244d3ce4a8f4cbc0156cde840af055c1bf8b76aebe422a4822086f
    restart: on-failure
    stop_grace_period: 1m
    shm_size: 256mb
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
      POSTGRES_DB: postgres
      # Keep the major-version path explicit so an accidental image-major bump
      # fails closed instead of silently initializing an apparently empty DB.
      PGDATA: /var/lib/postgresql/18/docker
      # Require SCRAM for network clients and initialize with page checksums.
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --data-checksums"
    depends_on:
      init-secrets:
        condition: service_completed_successfully
    command:
      - postgres
      - -c
      - password_encryption=scram-sha-256
    volumes:
      # PostgreSQL 18+ uses /var/lib/postgresql/<major>/docker. Mounting the
      # parent keeps all database state durable and supports future migrations.
      - ${APP_DATA_DIR}/data/postgres:/var/lib/postgresql
      - ${APP_DATA_DIR}/data/secrets:/run/secrets:ro
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=\"$$(cat /run/secrets/postgres-password)\" psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'SELECT 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  pgadmin:
    image: dpage/pgadmin4:9.17@sha256:2f4ce946ddf8360680d7eff4eaba1d91859eb6b4003e6623bad5c63a322c2f4d
    # The supported upstream entrypoint starts as root only to repair volume
    # ownership, then drops permanently to Umbrel's unprivileged uid/gid 1000.
    user: "0:0"
    restart: on-failure
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    environment:
      PUID: "1000"
      PGID: "1000"
      PGADMIN_DEFAULT_EMAIL: admin@umbrel.local
      PGADMIN_DEFAULT_PASSWORD: ${APP_PASSWORD}
      PGADMIN_LISTEN_PORT: "8080"
      PGADMIN_DISABLE_POSTFIX: "1"
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: "False"
      PGADMIN_CONFIG_SERVER_MODE: "True"
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "True"
      PGADMIN_CONFIG_UPGRADE_CHECK_ENABLED: "False"
      PGADMIN_CONFIG_CHECK_EMAIL_DELIVERABILITY: "False"
      PGADMIN_CONFIG_GLOBALLY_DELIVERABLE: "False"
      PGADMIN_CONFIG_ALLOW_SPECIAL_EMAIL_DOMAINS: "['local']"
    depends_on:
      init-secrets:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    volumes:
      - ${APP_DATA_DIR}/data/pgadmin:/var/lib/pgadmin
      - ${APP_DATA_DIR}/servers.json:/pgadmin4/servers.json:ro
    healthcheck:
      test:
        - CMD
        - /venv/bin/python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/misc/ping', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
